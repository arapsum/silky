server:
  protocol: http
  host: 127.0.0.1
  port: 7150

database:
  uri: postgresql://username:password@localhost:5432/database
  max_connections: 10
  min_connections: 1
  connection_timeout: 5
  idle_timeout: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

redis:
  url: redis://localhost:6379

logger:
  level: debug
  format: pretty
  crates:
    - axum
    - service

mailer:
  smtp:
    enable: true
    host: localhost
    port: 1025
    secure: false
    auth:
      # username:
      # password:

auth:
  cookie:
    secure: false
    same_site: lax
  access:
    public_key: secrets/keys/dev/access_key_pub.pem
    private_key: secrets/keys/dev/access_key.pem
    maxage: 900 # seconds 15 minutes
  refresh:
    public_key: secrets/keys/dev/refresh_key_pub.pem
    private_key: secrets/keys/dev/refresh_key.pem
    maxage: 604800 # seconds 7 days
  verification_token_expiry: 86400 # seconds 24 hours
  refresh_token_expiry: 900 # seconds 15 minutes

cors:
  allowed_origin:
    - http://127.0.0.1:5173
    - http://localhost:5173
    - http://127.0.0.1:4321
    - http://localhost:4321

stripe:
  checkout_success_url: http://localhost:4321/checkout/success?session_id={CHECKOUT_SESSION_ID}&order_pid={ORDER_PID}
  checkout_cancel_url: http://localhost:4321/checkout/cancel?order_pid={ORDER_PID}
  checkout_ttl_seconds: 1800
  live_mode: false
